version: '3.8'

services:
  node:
    container_name: frontend-node
    restart: unless-stopped
    build:
      context: .
    #    ports:
    #      - 3000:${WEBAPP_PORT}
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - node_network

  nginx:
    container_name: frontend-nginx
    restart: unless-stopped
    image: nginx
    ports:
      - 80:${NGINX_PORT}
    depends_on:
      - node
    volumes:
      - ./nginx/logistic_com_app.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/nginx_logs:/var/log/nginx/
    networks:
      - node_network

  postgresql:
    image: docker.io/bitnami/postgresql:10
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - 'postgresql_data:/bitnami/postgresql'

  sonarqube:
    image: docker.io/bitnami/sonarqube:8
    ports:
      - '90:9000'
    environment:
      - POSTGRESQL_HOST=postgresql
      - POSTGRESQL_ROOT_USER=postgres
      - POSTGRESQL_CLIENT_CREATE_DATABASE_NAME=bitnami_sonarqube
      - POSTGRESQL_CLIENT_CREATE_DATABASE_USERNAME=bn_sonarqube
      - POSTGRESQL_CLIENT_CREATE_DATABASE_PASSWORD=bitnami1234
      - POSTGRESQL_CLIENT_POSTGRES_PASSWORD=bitnami1234
      - SONARQUBE_DATABASE_NAME=bitnami_sonarqube
      - SONARQUBE_DATABASE_USER=bn_sonarqube
      - SONARQUBE_DATABASE_PASSWORD=bitnami1234
    volumes:
      - sonarqube_data:/bitnami

networks:
  node_network:

volumes:
  sonarqube_data:
    driver: local
  postgresql_data:
    driver: local
